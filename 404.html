<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Page Not Found — THE EMPIRE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'DM Mono', monospace;
  background: radial-gradient(ellipse at center, #0F1424 0%, #0B1120 70%);
  color: #F8FAFC;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2rem;
}
.card { max-width: 480px; }
.mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 64px;
  height: 64px;
  border-radius: 14px;
  background: linear-gradient(135deg, #D4AF37, #AA8C2C);
  color: #0B1120;
  font-family: 'Instrument Serif', serif;
  font-size: 2rem;
  font-weight: 700;
  margin-bottom: 1.5rem;
  box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
}
h1 {
  font-family: 'Instrument Serif', serif;
  font-size: 2.4rem;
  font-weight: 400;
  letter-spacing: -0.02em;
  margin-bottom: 0.75rem;
  background: linear-gradient(135deg, #D4AF37, #F4E8C1);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
p {
  color: #94A3B8;
  font-size: 0.85rem;
  line-height: 1.7;
  margin-bottom: 2rem;
}
.actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.75rem 1.5rem;
  border-radius: 40px;
  text-decoration: none;
  font-size: 0.75rem;
  font-weight: 500;
  transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
}
.btn-gold {
  background: linear-gradient(135deg, #D4AF37, #AA8C2C);
  color: #0B1120;
}
.btn-gold:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(212, 175, 55, 0.3);
}
.btn-outline {
  border: 1.5px solid rgba(212, 175, 55, 0.4);
  color: #D4AF37;
}
.btn-outline:hover {
  background: rgba(212, 175, 55, 0.1);
}
</style>
</head>
<body>
<div class="card">
  <div class="mark">E</div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist, has moved, or is no longer available.</p>
  <div class="actions">
    <a href="/" class="btn btn-gold">Return Home</a>
    <a href="/rewards-hub.html" class="btn btn-outline">Browse Free Resources</a>
  </div>
</div>
</body>
</html>
